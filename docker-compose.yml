# Ambar deployment. See spec §17 for the reasoning behind each choice here.
#
# DSM 7.2+ ships Container Manager, which imports this file directly as a
# "project". Plain `docker compose up -d` over SSH works too.

# Everything environment-specific is interpolated from .env, which stays local
# (.gitignore). §17: "Never hardcode these — they are configuration", and the
# repository carries no real paths, uids or hostnames.
services:
  ambar:
    image: ${AMBAR_IMAGE:-ghcr.io/datcal/ambar:latest}
    container_name: ambar
    restart: unless-stopped

    # REQUIRED — substitute the real uid:gid of the user that owns the library.
    # Get them with `ssh <user>@<nas> id`. On Synology, human users typically
    # start at uid 1026 and the `users` group is gid 100.
    #
    # This is not cosmetic: files extracted from _inbox by a root container are
    # owned by root and cannot be edited or deleted over SMB afterwards. The
    # container fails to start if it cannot write to /data, which is how a wrong
    # value here surfaces immediately instead of days later.
    user: "${AMBAR_UID:-1026}:${AMBAR_GID:-100}"

    ports:
      # host:container. DSM occupies 5000/5001 and several Synology packages take
      # 8080, so pick something unlikely to collide. Check with
      # `sudo netstat -tlnp` before settling on a number.
      - "${AMBAR_HOST_PORT:-8973}:8080"

    volumes:
      # The existing library, left exactly as it is. Read-write is required:
      # sidecars are written beside originals and _inbox extracts into the tree.
      # Originals themselves are never modified.
      - ${AMBAR_HOST_LIBRARY:-/volume2/game/assets}:/library

      # ambar.db, derivatives/, tools/, logs/, backups/.
      #
      # Deliberately a SIBLING of the library, not a child: derivatives grow to
      # several GB, and the database must not sit inside the tree that `scan`
      # walks or that a file-level backup copies while it is being written.
      #
      # This must be a real local volume. WAL corrupts on a network filesystem,
      # so never point this at another machine's SMB/NFS share.
      - ${AMBAR_HOST_DATA:-/volume2/game/ambar}:/data

    env_file: .env

    # Uncomment to keep container logs from growing without bound on a NAS.
    # logging:
    #   driver: json-file
    #   options:
    #     max-size: "10m"
    #     max-file: "3"

  # Optional remote access through a Cloudflare Tunnel: no port opened on the router,
  # TLS ends at Cloudflare. Off unless .env sets COMPOSE_PROFILES=tunnel together with
  # TUNNEL_TOKEN, the token the Zero Trust dashboard gives for the tunnel.
  #
  # It joins this project's network, so the tunnel's public hostname in the dashboard
  # points at http://ambar:8080 — the container port, not AMBAR_HOST_PORT. Set
  # AMBAR_TRUSTED_PROXIES to that network's subnet too, or every visitor reaches the
  # app as this container's address and they share one login rate-limit bucket.
  #
  # Downloads are fine through it. Uploads are not: Cloudflare rejects request bodies
  # over 100 MB on its free plan, so large packs go in over the LAN or through _inbox.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-ambar
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - ambar

  # Optional: a derive worker on the NAS itself, with Blender, so FBX and .blend files are
  # converted without another computer (internal/remote). Off unless COMPOSE_PROFILES
  # includes "worker"; scripts/deploy.sh then builds Dockerfile.worker and ships it too.
  #
  # One file at a time, in one Blender kept open between files, capped at one core and
  # weighted below the app, so the NAS stays responsive while it works through a backlog.
  # With the Background work page on Automatic, the app leaves derive jobs to it.
  #
  # It needs two things in the compose directory, or wherever the variables point:
  #   blender/        an official Blender for Linux, unpacked (blender.org, the .tar.xz)
  #   worker.token    an API token with the write scope, alone in the file:
  #                   docker exec ambar /ambar token add <user> --name nas-worker --scope write
  worker:
    image: ambar-worker:local
    container_name: ambar-worker
    profiles: [worker]
    restart: unless-stopped
    user: "${AMBAR_UID:-1026}:${AMBAR_GID:-100}"
    command:
      - --server=http://ambar:8080
      - --token-file=/run/ambar/worker.token
      - --library=/library
      - --workdir=/work
      - --blender=/opt/blender/blender
      - --concurrency=1
      - --name=nas
    environment:
      HOME: /work
    volumes:
      - ${AMBAR_HOST_LIBRARY:-/volume2/game/assets}:/library:ro
      - ${AMBAR_HOST_BLENDER:-./blender}:/opt/blender:ro
      - ${AMBAR_HOST_WORKER_TOKEN:-./worker.token}:/run/ambar/worker.token:ro
    cpus: 1
    cpu_shares: 256
    mem_limit: 1536m
    depends_on:
      - ambar

# First run, once the container is up:
#
#   docker exec -it ambar /ambar user add <username>
#
# There is no self-registration and no default account (§11). Then open
# http://<nas>:8973/ and sign in.
#
# Manual backup, or from DSM Task Scheduler — do not hand-edit the Synology
# crontab, since DSM updates can overwrite it:
#
#   docker exec ambar /ambar backup        # available from M11
